[env:msp430f5507]
platform = timsp430
board = msp430f5507
build_flags = -Isrc/USB -Isrc/USB/USB_config -Isrc/F5xx_F6xx_Core_Lib
    -fpack-struct -fdata-sections -ffunction-sections

